<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Apostolado Videre — acesso ao livro de orações PRECES."
    />
    <title>Apostolado Videre · PRECES</title>
    <style>
      :root {
        --paper: #faf4e7;
        --paper-deep: #f1e7d4;
        --ink: #172c4c;
        --muted: #656054;
        --line: #dfcda9;
        --accent: #795919;
        --blue: #0b2a56;
        --red: #930f1a;
        --gold: #c1963c;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 10%, #fffaf0 0, transparent 35%),
          linear-gradient(135deg, var(--paper) 0%, var(--paper-deep) 100%);
        font-family: Georgia, "Times New Roman", serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        z-index: -1;
        width: 290px;
        height: 290px;
        border: 1px solid color-mix(in srgb, var(--gold) 32%, transparent);
        transform: rotate(45deg);
      }

      body::before {
        top: -205px;
        left: -145px;
      }

      body::after {
        right: -145px;
        bottom: -205px;
      }

      main {
        width: min(92%, 760px);
        margin: 48px auto;
        text-align: center;
      }

      .panel {
        position: relative;
        padding: clamp(48px, 8vw, 82px) clamp(24px, 8vw, 76px);
        border: 1px solid var(--line);
        border-top: 5px solid var(--red);
        background: color-mix(in srgb, #fffdf7 90%, transparent);
        box-shadow: 0 24px 65px rgba(23, 44, 76, 0.1);
      }

      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        left: 20px;
        right: 20px;
        height: 1px;
        background: var(--gold);
        opacity: 0.65;
      }

      .panel::before {
        top: 16px;
      }

      .panel::after {
        bottom: 16px;
      }

      .cross {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        margin: 0 auto 24px;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--gold);
        font-size: 30px;
        line-height: 1;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--red);
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--blue);
        font-size: clamp(44px, 10vw, 78px);
        font-weight: normal;
        letter-spacing: 0.12em;
        line-height: 1;
      }

      .edition {
        margin: 17px 0 0;
        color: var(--accent);
        font-family: Arial, sans-serif;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .rule {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 370px);
        margin: 29px auto;
        color: var(--gold);
      }

      .rule::before,
      .rule::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .description {
        max-width: 500px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(17px, 2.5vw, 20px);
        line-height: 1.65;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-width: 230px;
        min-height: 54px;
        margin-top: 35px;
        padding: 15px 28px;
        border: 1px solid var(--blue);
        color: #fffdf7;
        background: var(--blue);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .button::after {
        content: "→";
        font-size: 18px;
        font-weight: normal;
        line-height: 1;
        transition: transform 180ms ease;
      }

      .button:hover {
        border-color: var(--red);
        background: var(--red);
        box-shadow: 0 10px 24px rgba(147, 15, 26, 0.16);
        transform: translateY(-2px);
      }

      .button:hover::after {
        transform: translateX(4px);
      }

      .button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 5px;
      }

      .motto {
        margin: 28px 0 0;
        color: var(--red);
        font-size: 14px;
        font-style: italic;
      }

      @media (max-width: 480px) {
        main {
          width: calc(100% - 28px);
          margin: 14px auto;
        }

        .panel {
          padding-right: 24px;
          padding-left: 24px;
        }

        h1 {
          letter-spacing: 0.08em;
        }

        .button {
          width: 100%;
          min-width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button,
        .button::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="titulo">
        <div class="cross" aria-hidden="true">✠</div>
        <p class="eyebrow">Apostolado Videre</p>
        <h1 id="titulo">PRECES</h1>
        <p class="edition">Português &nbsp;·&nbsp; Latine</p>
        <div class="rule" aria-hidden="true">◆</div>
        <p class="description">
          Orações para santificar o dia, recolher o coração e permanecer na
          presença de Deus.
        </p>
        <a class="button" href="PRECES.html">Acessar o PRECES</a>
        <p class="motto" lang="la">Omnia in lumine Christi</p>
      </section>
    </main>
  </body>
</html>
